name: GEF Compliance Check
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gef-compliance:
    name: GEF Hard Limits & Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check file sizes (Max 400 lines)
        run: |
          echo "Checking file sizes for modified files..."
          git diff --name-only origin/${{ github.base_ref }} HEAD | while read file; do
            if [ -f "$file" ]; then
              LINES=$(wc -l < "$file")
              if [ "$LINES" -gt 400 ]; then
                echo "::error file=$file::File $file exceeds the 400 lines limit ($LINES lines). Split it."
                exit 1
              fi
            fi
          done

      - name: Check Linter Bypasses
        run: |
          echo "Checking for unauthorized linter bypasses..."
          BYPASS=$(git diff --name-only origin/${{ github.base_ref }} HEAD -G"(eslint-disable|@ts-ignore|biome-ignore)")
          if [ -n "$BYPASS" ]; then
            echo "::error::Linter bypass detected in files: $BYPASS"
            exit 1
          fi

      - name: Check Mandatory Documentation
        run: |
          echo "Checking documentation rules..."
          MODIFIED=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          BRANCH_NAME=${{ github.head_ref }}
          
          if [[ "$BRANCH_NAME" == fix/* ]]; then
            if ! echo "$MODIFIED" | grep -q "RESEARCH_LOG.md"; then
              echo "::error::Bugfix branch ($BRANCH_NAME) MUST modify RESEARCH_LOG.md"
              exit 1
            fi
          fi
          
          if echo "$MODIFIED" | grep -q "^package.json$"; then
            if ! echo "$MODIFIED" | grep -q "^docs/explanation/adr/"; then
              echo "::error::package.json was modified but no ADR was added in docs/explanation/adr/"
              exit 1
            fi
          fi
