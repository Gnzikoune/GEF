name: GEF Semantic Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  semantic-review:
    name: LLM or Heuristic Semantic Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Semantic Reviewer
        env:
          GEF_LLM_API_KEY: ${{ secrets.GEF_LLM_API_KEY }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node .github/workflows/scripts/semantic-reviewer.js
