on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          package-name: create-gef
          changelog-types: |
            chore: { skip: false }
            docs: { skip: false }
            feat: { skip: false }
            fix: { skip: false }
            refactor: { skip: false }
            style: { skip: false }
            test: { skip: false }
            ci: { skip: true }
            build: { skip: true }

      # Les étapes ci-dessous ne s'exécutent QUE si Release Please a effectivement créé une nouvelle release (après le merge de la PR)
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.release_created }}
        
      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}
        
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs.release_created }}
